<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSFCU Conductor QR Gate Scanner Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 md:p-8 flex flex-col items-center">
  <header className="max-w-4xl w-full flex items-center justify-between mb-8 border-b border-slate-800 pb-4">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 bg-blue-600 rounded-xl flex items-center justify-center font-extrabold text-lg">🚌</div>
      <div>
        <h1 class="text-xl font-extrabold tracking-tight text-white">GSFCU Conductor QR Gate Scanner</h1>
        <p class="text-xs text-slate-400 font-mono">Bus Entry Verification Terminal · Gate 1</p>
      </div>
    </div>
    <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-xs font-mono font-bold px-3 py-1 rounded-full">LIVE GATE ACTIVE</span>
  </header>

  <main class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Camera Viewfinder Box -->
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 flex flex-col items-center justify-center relative min-h-[380px]">
      <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-transparent via-emerald-400 to-transparent animate-pulse"></div>
      
      <div class="w-56 h-56 border-2 border-dashed border-emerald-400/60 rounded-3xl flex flex-col items-center justify-center p-4 bg-emerald-950/20 relative">
        <div class="text-4xl mb-2">📷</div>
        <div class="text-xs font-mono font-bold text-emerald-400 tracking-wider">TARGET QR SCANNER</div>
        <p class="text-[10px] text-slate-400 text-center mt-1">Align student digital bus pass inside viewfinder</p>
      </div>

      <div class="mt-6 w-full space-y-2">
        <label class="text-[11px] font-mono font-bold text-emerald-400 uppercase">⚡ Demo Evaluation Presets</label>
        <select id="presetSelect" onchange="runPreset(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white outline-none">
          <option value="">Select student pass to scan...</option>
          <option value="om">Om Thakkar (24BT04171 — Route 1 Soma Talav)</option>
          <option value="alex">Alex Sharma (22CS089 — Route 2 Sama Savli)</option>
          <option value="priya">Priya Patel (23ME044 — EXPIRED PASS DEMO)</option>
        </select>
      </div>
    </div>

    <!-- Verified Identity Output Card -->
    <div id="outputCard" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 flex flex-col justify-between">
      <div class="text-center py-12 text-slate-500">
        <div class="text-5xl mb-3">🔍</div>
        <h3 class="text-lg font-bold text-slate-300">Scanner Ready</h3>
        <p class="text-xs text-slate-500 mt-1">Select a student preset on the left to verify entry pass</p>
      </div>
    </div>
  </main>

  <script>
    const dataMap = {
      om: {
        valid: true,
        name: "Om Thakkar",
        roll: "24BT04171",
        dept: "Computer Science & Engineering",
        route: "Route 1 · Soma Talav → GSFCU",
        validity: "2026-07-01 to 2027-01-31",
        status: "Verified Paid",
        photo: "OT"
      },
      alex: {
        valid: true,
        name: "Alex Sharma",
        roll: "22CS089",
        dept: "Chemical Engineering",
        route: "Route 2 · Parivar → GSFCU",
        validity: "2026-07-01 to 2027-01-31",
        status: "Verified Paid",
        photo: "AS"
      },
      priya: {
        valid: false,
        name: "Priya Patel",
        roll: "23ME044",
        dept: "Mechanical Engineering",
        route: "Route 6 · Voltamp → GSFCU",
        validity: "Expired 2026-05-31",
        status: "Unpaid / Expired",
        photo: "PP"
      }
    };

    function runPreset(key) {
      if (!key) return;
      const d = dataMap[key];
      const card = document.getElementById("outputCard");
      const time = new Date().toLocaleTimeString();

      if (d.valid) {
        card.className = "bg-slate-900 border-2 border-emerald-500/60 rounded-3xl p-6 flex flex-col justify-between shadow-2xl animate-in fade-in";
        card.innerHTML = `
          <div class="space-y-4">
            <div class="bg-emerald-500/10 border border-emerald-500/40 text-emerald-400 p-3.5 rounded-2xl flex items-center justify-between">
              <div>
                <div class="font-extrabold text-sm tracking-wide font-mono">✓ PASS VERIFIED — ENTRY ALLOWED</div>
                <div class="text-[11px] opacity-80">Identity & Bus Pass Verified</div>
              </div>
              <span class="text-xs font-mono bg-slate-950 px-2.5 py-1 rounded-lg border border-emerald-500/30">${time}</span>
            </div>

            <div class="flex items-center gap-4 bg-slate-950 p-4 rounded-2xl border border-slate-800">
              <div class="h-16 w-16 bg-blue-600 rounded-2xl flex items-center justify-center font-extrabold text-xl text-white">
                ${d.photo}
              </div>
              <div>
                <div class="text-[10px] font-mono text-blue-400 uppercase font-bold">GSFCU VERIFIED STUDENT</div>
                <div class="text-xl font-extrabold text-white">${d.name}</div>
                <div class="text-xs font-mono text-slate-400">Roll: ${d.roll} · ${d.dept}</div>
              </div>
            </div>

            <div class="space-y-2 text-xs font-mono bg-slate-950 p-4 rounded-2xl border border-slate-800">
              <div class="flex justify-between"><span class="text-slate-400">Assigned Route:</span> <span class="font-bold text-white">${d.route}</span></div>
              <div class="flex justify-between"><span class="text-slate-400">Validity:</span> <span class="text-slate-300">${d.validity}</span></div>
              <div class="flex justify-between"><span class="text-slate-400">Semester Fee:</span> <span class="text-emerald-400 font-bold">${d.status}</span></div>
            </div>
          </div>
          <button onclick="location.reload()" class="mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs py-3 rounded-xl transition">Scan Next Pass</button>
        `;
      } else {
        card.className = "bg-slate-900 border-2 border-red-500/60 rounded-3xl p-6 flex flex-col justify-between shadow-2xl animate-in fade-in";
        card.innerHTML = `
          <div class="space-y-4">
            <div class="bg-red-500/10 border border-red-500/40 text-red-400 p-3.5 rounded-2xl flex items-center justify-between">
              <div>
                <div class="font-extrabold text-sm tracking-wide font-mono">🚫 PASS EXPIRED / DENIED</div>
                <div class="text-[11px] opacity-80">Invalid or Expired Entry Pass</div>
              </div>
              <span class="text-xs font-mono bg-slate-950 px-2.5 py-1 rounded-lg border border-red-500/30">${time}</span>
            </div>

            <div class="flex items-center gap-4 bg-slate-950 p-4 rounded-2xl border border-slate-800">
              <div class="h-16 w-16 bg-red-800 rounded-2xl flex items-center justify-center font-extrabold text-xl text-white">
                ${d.photo}
              </div>
              <div>
                <div class="text-[10px] font-mono text-red-400 uppercase font-bold">UNVERIFIED IDENTITY</div>
                <div class="text-xl font-extrabold text-white">${d.name}</div>
                <div class="text-xs font-mono text-slate-400">Roll: ${d.roll} · ${d.dept}</div>
              </div>
            </div>
          </div>
          <button onclick="location.reload()" class="mt-4 w-full bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs py-3 rounded-xl transition">Reset Scanner</button>
        `;
      }
    }
  </script>
</body>
</html>
